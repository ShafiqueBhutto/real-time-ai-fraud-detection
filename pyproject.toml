[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-ai-fraud-detection"
version = "0.1.0"
description = "Real-Time AI Fraud Detection & Risk Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Shafique Bhutto" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]